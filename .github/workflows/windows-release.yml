name: Windows layout diagnostic (disposable branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements/build.txt
      - name: Install locked requirements and this source package
        run: |
          python -m pip install --force-reinstall --no-cache-dir -r tools/requirements/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed.' }
          python -m pip install -e . --no-build-isolation
          if ($LASTEXITCODE -ne 0) { throw 'Source package installation failed.' }
      - name: Run the bounded native parallel-runner diagnostic
        run: |
          @'
          from pathlib import Path
          import json
          import subprocess
          import sys
          import time

          output = Path('windows-layout-diagnostics')
          output.mkdir(exist_ok=True)
          child = output / 'diagnostic_child.py'
          child.write_text('''import faulthandler
          import platform
          import sys
          import tkinter.font
          import unittest

          faulthandler.enable()
          faulthandler.dump_traceback_later(30, repeat=True)
          print('DIAGNOSTIC Python:', sys.version, 'platform:', platform.platform(), flush=True)
          original_setup = unittest.TestCase._callSetUp
          def setup_with_geometry(test):
              original_setup(test)
              root = getattr(test, 'root', None)
              if root is not None and hasattr(root, 'tk'):
                  print('DIAGNOSTIC Tk:', root.tk.call('package', 'provide', 'Tk'),
                        'scaling:', root.tk.call('tk', 'scaling'),
                        'root:', root.winfo_geometry(), 'minimum:', root.minsize(),
                        'maximum:', root.maxsize(), 'screen:', (root.winfo_screenwidth(), root.winfo_screenheight()), flush=True)
                  font = tkinter.font.nametofont('TkDefaultFont', root=root)
                  print('DIAGNOSTIC native font:', font.actual(), 'metrics:', font.metrics(), flush=True)
                  editor = getattr(test, 'editor', None)
                  fields = getattr(editor, 'fields', None)
                  if fields is not None:
                      print('DIAGNOSTIC fields:', fields.winfo_geometry(),
                            'requested:', (fields.winfo_reqwidth(), fields.winfo_reqheight()), flush=True)
          unittest.TestCase._callSetUp = setup_with_geometry
          program = unittest.main(module=None, argv=['unittest', '-v', sys.argv[1]], exit=False)
          faulthandler.cancel_dump_traceback_later()
          result = program.result
          print('DIAGNOSTIC result:', result.testsRun, 'tests;', len(result.skipped), 'skips', flush=True)
          expected = sys.argv[2]
          count_ok = result.testsRun > 0 if expected == 'positive' else result.testsRun == int(expected)
          raise SystemExit(0 if result.wasSuccessful() and count_ok and not result.skipped else 1)
          ''', encoding='utf-8')
          tests = [
              ('tests.test_parallel_runner', 180, 'positive'),
          ]
          records = []
          for index, (name, limit, expected) in enumerate(tests):
              log = output / f'{index}-{name.rsplit(".", 1)[-1]}.log'
              started = time.monotonic()
              timed_out = False
              print(f'===== START {name} ({limit} second limit) =====', flush=True)
              with log.open('wb') as stream:
                  process = subprocess.Popen([sys.executable, '-u', '-c', child.read_text(encoding='utf-8'), name, expected], stdout=stream, stderr=subprocess.STDOUT)
                  try:
                      code = process.wait(timeout=limit)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      process.kill()
                      code = process.wait(timeout=10)
              print(log.read_text(encoding='utf-8', errors='replace'), flush=True)
              record = {'test': name, 'returncode': code, 'timeout': timed_out,
                        'limit_seconds': limit, 'expected_count': expected,
                        'duration_seconds': time.monotonic() - started, 'log': log.name}
              records.append(record)
              (output / 'summary.json').write_text(json.dumps(records, indent=2), encoding='utf-8')
              print('===== END ' + json.dumps(record) + ' =====', flush=True)
          raise SystemExit(1 if any(item['returncode'] != 0 or item['timeout'] for item in records) else 0)
          '@ | python -u -
          if ($LASTEXITCODE -ne 0) { throw 'One or more independent layout diagnostics failed, skipped or timed out; inspect the complete logs.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-layout-diagnostics
          path: windows-layout-diagnostics/
          if-no-files-found: warn
