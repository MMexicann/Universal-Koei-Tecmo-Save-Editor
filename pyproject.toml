[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-koei-tecmo-save-editor"
version = "2.5.4"
description = "Mexican's Windows save editor for 96 Koei Tecmo game/platform profiles, with 139 scoped platform conversion routes, native save comparison, reviewed conversion queues, backups and Undo."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mexican"}]

[project.scripts]
universal-koei-editor = "koei_editor.application:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["koei_editor*"]

[tool.setuptools.package-data]
koei_editor = ["data/*.json"]
