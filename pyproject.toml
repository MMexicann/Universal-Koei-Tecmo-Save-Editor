[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-koei-tecmo-game-toolkit"
version = "1.0"
description = "Windows toolkit by Mexican for supported Koei Tecmo saves, build planning, mod management, selected PC settings and read-only asset tools, with backups and Undo."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mexican"}]
dependencies = [
    "miniaudio>=1.71,<2",
    "trimesh>=5.1.1,<6",
]

[project.scripts]
universal-koei-toolkit = "koei_editor.cli:main"
universal-koei-editor = "koei_editor.application:main"

[project.urls]
Homepage = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor"
Downloads = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor/releases/latest"
Documentation = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor/tree/main/docs"
Issues = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["koei_editor*"]

[tool.setuptools.package-data]
koei_editor = ["data/*.json"]
