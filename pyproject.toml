[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-koei-tecmo-game-toolkit"
version = "3.1"
description = "Mexican's Windows toolkit for supported Koei Tecmo saves: editing, dashboards, comparison, scoped conversion, save management and reviewed automation."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mexican"}]

[project.scripts]
universal-koei-toolkit = "koei_editor.application:main"
universal-koei-editor = "koei_editor.application:main"

[project.urls]
Homepage = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor"
Downloads = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor/releases/latest"
Documentation = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor/tree/main/docs"
Issues = "https://github.com/MMexicann/Universal-Koei-Tecmo-Save-Editor/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["koei_editor*"]

[tool.setuptools.package-data]
koei_editor = ["data/*.json"]
